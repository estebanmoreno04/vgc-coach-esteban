# Modified by estebanmoreno04 (fork of NoahJenkins/vgc-coach): no regulation is
# written here. The active regulation, its window and its official announcement
# URL are discovered at runtime by tools/resolve_regulation.py and stored in
# data/current/regulation.json. These entries are for live checks only.
version: "3"
summary: "Use these shared live-source roles for live checks on top of the local snapshot in data/current/. The active regulation and its official announcement are discovered automatically and stored in data/current/regulation.json; browse live only for what happened after the snapshot or what the snapshot cannot show."
usage: "Official sources define legality and active mechanics. Community sources describe what players are doing inside that legal format. Supporting sources sharpen set and event context after the core format and usage picture are grounded."
minimum_stack:
  official: 1
  tournament_meta: 1
  broader_meta: 1
sources:
  - id: official-champions-news
    display_name: Pokémon Champions in-game news (official)
    role: official_regulation
    source_kind: official
    canonical_url: https://champions-news.pokemon-home.com/en/list
    priority: 1
    allowed_claim_types:
      - legality
      - mechanics
      - format_dates
      - held_item_rules
      - timers
    required_for_minimum_stack: true
    freshness:
      max_age_days: 7
      policy: The concrete announcement for the active regulation is `official_url` in data/current/regulation.json; re-open it live for species, move or item eligibility questions.
    required_evidence_fields:
      - source_id
      - source_url
      - fetched_at
      - format_window
      - active_mechanics
      - claim_type
    use_for:
      - active regulation dates and announced next regulation
      - active mechanics
      - eligible Pokémon, held item rules and timers
    do_not_use_for:
      - tournament usage claims
      - prevalence claims about specific teams or cores
      - set tendency claims
    fallback_if_unavailable:
      - Use data/current/regulation.json and say when it was last checked.
      - If no current official rules source is available, do not make present-tense legality or mechanics claims beyond what the regulation file states.
  - id: play-pokemon-transition-announcement
    display_name: Play! Pokemon transition announcement
    role: official_transition
    source_kind: official
    canonical_url: https://www.pokemon.com/uk/pokemon-news/play-pokemon-competitions-transition-to-pokemon-champions-on-april-and-may-2026
    priority: 2
    allowed_claim_types:
      - event_timing
      - transition_context
    required_for_minimum_stack: false
    freshness:
      max_age_days: 30
      policy: Historical context only; pokemon.com is for manual reading (it blocks automated clients).
    required_evidence_fields:
      - source_id
      - source_url
      - fetched_at
      - published_at
      - claim_type
    use_for:
      - historical context for the transition from Pokemon Scarlet and Violet to Pokemon Champions
    do_not_use_for:
      - legality or mechanics overrides
      - usage claims
      - set tendency claims
    fallback_if_unavailable:
      - Omit transition claims rather than guessing.
  - id: vgchistory
    display_name: VGC History
    role: tournament_meta
    source_kind: community
    canonical_url: https://vgchistory.com/tournaments
    priority: 3
    allowed_claim_types:
      - tournament_usage
      - top_teams
      - current_snapshot
      - win_rate
      - core_pairs
    required_for_minimum_stack: true
    freshness:
      max_age_days: 7
      policy: Primary in-person source of the local snapshot; check live only for official events newer than the snapshot's data_through.
    required_evidence_fields:
      - source_id
      - source_url
      - fetched_at
      - claim_type
      - sample_scope
      - freshness_note
    use_for:
      - whole-field standings, records and open team sheets of official in-person events
      - day 2 and top cut teams
    do_not_use_for:
      - legality or mechanics claims
      - online or ladder usage claims
    fallback_if_unavailable:
      - Use limitlessvgc.com tournament pages (day 2 team lists) and say which source replaced it.
      - If no in-person source is available, keep in-person conclusions to the local snapshot and state its age.
  - id: limitless-vgc
    display_name: Limitless VGC
    role: tournament_meta
    source_kind: community
    canonical_url: https://limitlessvgc.com/tournaments
    priority: 4
    allowed_claim_types:
      - tournament_usage
      - top_teams
      - current_snapshot
    required_for_minimum_stack: false
    freshness:
      max_age_days: 7
      policy: Fallback in-person source; shows day 2 team lists with the regulation of each event.
    required_evidence_fields:
      - source_id
      - source_url
      - fetched_at
      - claim_type
      - sample_scope
      - freshness_note
    use_for:
      - official event results and day 2 team lists, labeled by regulation
    do_not_use_for:
      - legality or mechanics claims
      - whole-field usage claims (it lists day 2 teams only)
    fallback_if_unavailable:
      - Use VGC History or the local snapshot and label the gap.
  - id: limitless-play
    display_name: Limitless tournament platform (online)
    role: broader_meta
    source_kind: community
    canonical_url: https://play.limitlesstcg.com/tournaments?game=VGC
    priority: 5
    allowed_claim_types:
      - tournament_usage
      - top_teams
      - win_rate
      - core_pairs
    required_for_minimum_stack: true
    freshness:
      max_age_days: 7
      policy: Online complement of the local snapshot (64+ player events); check live only for events newer than the snapshot.
    required_evidence_fields:
      - source_id
      - source_url
      - fetched_at
      - claim_type
      - sample_scope
      - freshness_note
    use_for:
      - online tournament usage, records and team lists
    do_not_use_for:
      - legality or mechanics claims
      - in-person or official event claims
    fallback_if_unavailable:
      - Use Pikalytics tournament pages and label the replacement.
      - If broader usage coverage is missing, keep current-field claims to the in-person snapshot.
  - id: pikalytics-champions
    display_name: Pikalytics Champions
    role: supporting_sets
    source_kind: supporting
    canonical_url: https://www.pikalytics.com/ai/pokedex
    priority: 6
    allowed_claim_types:
      - set_tendencies
      - common_partners
      - move_tendencies
      - item_tendencies
      - ability_tendencies
    required_for_minimum_stack: false
    freshness:
      max_age_days: 7
      policy: Re-check live before set, partner, move, item, or ability tendency claims that the snapshot does not cover.
    required_evidence_fields:
      - source_id
      - source_url
      - fetched_at
      - claim_type
      - sample_scope
      - freshness_note
    use_for:
      - set tendencies
      - common partners
      - move, item, and ability expectations
    do_not_use_for:
      - legality or mechanics claims
      - source-of-truth usage claims
      - official event timing claims
    fallback_if_unavailable:
      - Use the sets section of the local snapshot.
      - If no supporting set source is available, keep set details broader instead of inventing exact tendencies.
  - id: victory-road
    display_name: Victory Road
    role: editorial_context
    source_kind: editorial
    canonical_url: https://victoryroad.pro/
    priority: 7
    allowed_claim_types:
      - event_context
      - tournament_coverage
      - editorial_interpretation
    required_for_minimum_stack: false
    freshness:
      max_age_days: 14
      policy: Re-check live before event context, tournament coverage, or editorial interpretation claims.
    required_evidence_fields:
      - source_id
      - source_url
      - fetched_at
      - published_at
      - claim_type
      - freshness_note
    use_for:
      - event context and upcoming event calendar
      - tournament coverage
      - human-written competitive interpretation
    do_not_use_for:
      - legality or mechanics claims
      - sole proof of current prevalence
      - exact set legality claims
    fallback_if_unavailable:
      - Answer from the verified official and snapshot stack without adding extra narrative certainty.
