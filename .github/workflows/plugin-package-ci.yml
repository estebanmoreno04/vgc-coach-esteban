name: Plugin Package CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: plugin-package-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plugin-package-check:
    name: plugin-package-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      # Modified by estebanmoreno04 (fork of NoahJenkins/vgc-coach): also install
      # the data pipeline dependencies used by the regulation resolver tests,
      # and Node plus the pinned @smogon/calc package for the damage calc tests.
      - name: Install validation dependencies
        run: python3 -m pip install -r tools/requirements-autoresearch.txt -r tools/requirements-data.txt

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Install calc dependencies
        run: npm ci --no-audit --no-fund
        working-directory: tools/calc

      - name: Run core validation
        run: python3 tools/validate.py --scope core
